# ============================================================
# tmux
# ============================================================


# ============================================================
# Terminal / Ghostty
# ============================================================

set -g default-terminal "tmux-256color"

# Ghostty uses TERM=xterm-ghostty outside tmux.
# Advertise true-color support to tmux.
set -as terminal-features ",xterm-ghostty:RGB"


# ============================================================
# Prefix
# ============================================================

set -g prefix C-a

unbind C-b
bind C-a send-prefix


# ============================================================
# Core
# ============================================================

set -g base-index 1

set -g detach-on-destroy off

set -sg escape-time 0

set -g history-limit 1000000

set -g renumber-windows on

set -g set-clipboard on

# Scroll with the mouse wheel and select/copy text without leaving tmux.
set -g mouse on

set -g focus-events on

set -g display-time 4000

set -g status-interval 5


# ============================================================
# Status
# ============================================================

set -g status-position top

set -g status-left-length 100
set -g status-right-length 100


# ============================================================
# Vi mode
# ============================================================

setw -g mode-keys vi

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel
bind -T copy-mode-vi q send-keys -X cancel
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi PageUp send-keys -X page-up
bind -T copy-mode-vi PageDown send-keys -X page-down
bind -T copy-mode-vi C-u send-keys -X halfpage-up
bind -T copy-mode-vi C-d send-keys -X halfpage-down
bind -T copy-mode-vi g send-keys -X history-top
bind -T copy-mode-vi G send-keys -X history-bottom


# ============================================================
# Windows
# ============================================================

bind c new-window -c "#{pane_current_path}"

bind H previous-window
bind L next-window

bind r command-prompt "rename-window %%"

bind R source-file ~/.config/tmux/tmux.conf \;\
       display-message "tmux.conf reloaded"


# ============================================================
# Panes
# ============================================================

bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind z resize-pane -Z


# ============================================================
# Resize
# ============================================================

bind -r ',' resize-pane -L 20
bind -r '.' resize-pane -R 20
bind -r '-' resize-pane -D 7
bind -r '=' resize-pane -U 7


# ============================================================
# Sessions
# ============================================================

bind S choose-session

bind '*' setw synchronize-panes \;\
         display-message "synchronize-panes: #{?pane_synchronized,on,off}"


# ============================================================
# tmux-fzf-url
# ============================================================

set -g @fzf-url-fzf-options \
  '-p 60%,30% --prompt="   " --border-label=" Open URL "'

set -g @fzf-url-history-limit '2000'


# ============================================================
# SessionX
# ============================================================

set -g @sessionx-bind 'o'
set -g @sessionx-auto-accept 'off'

set -g @sessionx-window-height '85%'
set -g @sessionx-window-width '75%'

set -g @sessionx-zoxide-mode 'on'
set -g @sessionx-filter-current 'false'

# Hide Floax scratch session from SessionX.
set -g @sessionx-filtered-sessions 'scratch'


# ============================================================
# Resurrect / Continuum
# ============================================================

set -g @resurrect-strategy-nvim 'session'

# Keep periodic snapshots, but NEVER restore them automatically.
set -g @continuum-restore 'off'


# ============================================================
# Catppuccin
# ============================================================

set -g @catppuccin_flavor "mocha"

set -g @catppuccin_window_status_style "rounded"

set -g @catppuccin_window_text "#W"

set -g @catppuccin_window_current_text \
  "#W#{?window_zoomed_flag,(),}"

set -g @catppuccin_directory_text \
  "#{b:pane_current_path}"

set -g status-left \
  "#{E:@catppuccin_status_session}"

set -g status-right \
  "#{E:@catppuccin_status_directory}"


# ============================================================
# Plugins
# ============================================================

set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @plugin 'fcsonline/tmux-thumbs'

set -g @plugin 'sainnhe/tmux-fzf'

set -g @plugin 'wfxr/tmux-fzf-url'

set -g @plugin 'catppuccin/tmux#v2.3.0'

set -g @plugin 'omerxx/tmux-sessionx'

set -g @plugin 'omerxx/tmux-floax'

# Keep Continuum last.
set -g @plugin 'tmux-plugins/tmux-continuum'


# ============================================================
# TPM
# Keep this at the bottom.
# ============================================================

run '~/.config/tmux/plugins/tpm/tpm'
